<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="canonical" href="https://subaog.com/">

  <meta property="og:type" content="website">
  <meta http-equiv="refresh" content="1; url=/zh-cn/">
  <style>
    :root{--primary:#0066CC;--text:#1A1A2E;--text-secondary:#64748B}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#F5F7FA;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:14px}
    p{color:var(--text-secondary)}
    a{color:var(--primary);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/zh-cn/">
    <p>Redirecting... Please choose: <a href="/zh-cn/">中文</a> · <a href="/en/">English</a></p>
  </noscript>
  <script>
    (function(){
      try{
        var lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'zh-CN';
        if(/^en\b/.test(lang)) window.location.replace('/en/');
        else window.location.replace('/zh-cn/');
      } catch(e){
        window.location.replace('/zh-cn/');
      }
    })();
  </script>
</body>
