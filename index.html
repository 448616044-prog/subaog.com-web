<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subao Global Logistics | Choose Your Language</title>
  <meta name="description" content="Subao Global Logistics — International shipping to China. Choose your language: 中文 / English.">
  <link rel="alternate" hreflang="zh-CN" href="https://subaog.com/zh-cn/">
  <link rel="alternate" hreflang="en" href="https://subaog.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://subaog.com/">
  <link rel="canonical" href="https://subaog.com/">
  <meta property="og:title" content="Subao Global Logistics">
  <meta property="og:description" content="Choose your language: 中文 / English.">
  <meta property="og:url" content="https://subaog.com/">
  <meta property="og:type" content="website">
  <style>
    :root{--primary:#0066CC;--primary-dark:#004C99;--primary-light:#E6F0FA;--accent:#E65100;--green:#00B900;--bg:#F5F7FA;--text:#1A1A2E;--text-secondary:#64748B;--border:#E2E8F0;--radius:14px;--shadow-lg:0 8px 32px rgba(0,0,0,.10)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:var(--text);line-height:1.6;background:linear-gradient(135deg,#0066CC 0%,#004C99 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{background:#fff;border-radius:24px;padding:48px 40px;max-width:640px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
    .logo{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px;letter-spacing:-.5px}
    .logo small{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-top:4px}
    h1{font-size:22px;font-weight:700;color:var(--text);margin:28px 0 8px}
    .sub{color:var(--text-secondary);font-size:14px;margin-bottom:36px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px}
    .choice{display:block;padding:32px 16px;border:2px solid var(--border);border-radius:var(--radius);transition:all .2s;text-decoration:none;color:var(--text);cursor:pointer}
    .choice:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
    .choice .flag{font-size:48px;display:block;margin-bottom:12px}
    .choice .name{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:4px}
    .choice .desc{font-size:13px;color:var(--text-secondary)}
    .footer{font-size:12px;color:var(--text-secondary);margin-top:24px}
    .footer a{color:var(--primary);text-decoration:none}
    @media(max-width:520px){.choices{grid-template-columns:1fr}.wrap{padding:32px 24px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">速豹国际物流<small>Subao Global Logistics</small></div>
    <h1>选择语言 / Choose your language</h1>
    <p class="sub">各国寄中国回国行李 · Door-to-door with tax included</p>
    <div class="choices">
      <a href="/zh-cn/" class="choice">
        <span class="flag">🇨🇳</span>
        <div class="name">中文</div>
        <div class="desc">Simplified Chinese</div>
      </a>
      <a href="/en/" class="choice">
        <span class="flag">🇺🇸</span>
        <div class="name">English</div>
        <div class="desc">English version</div>
      </a>
    </div>
    <p class="footer">Need help? <a href="https://wa.me/message/your-number">WhatsApp</a> · <a href="/zh-cn/contact/">Contact</a></p>
  </div>
  <script>
    // Auto-redirect based on browser language
    (function(){
      try{
        var lang = (navigator.languages && navigator.languages[0]) || navigator.language || 'zh-CN';
        lang = (lang+'').toLowerCase();
        if(/^en\b/.test(lang)){
          window.location.replace('/en/');
        } else {
          window.location.replace('/zh-cn/');
        }
      } catch(e){
        // If detection fails, do nothing — let user choose
      }
    })();
  </script>
</body>
</html>
